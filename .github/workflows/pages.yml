name: Deploy Jeongyeon to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Whole-corpus checks share large immutable teaching data. Bound worker
      # contention just as in the verified local release command.
      - run: npm test -- --maxWorkers=2
      - name: Verify curated vocabulary and source metadata
        run: |
          npm run test:data
          python3 scripts/check-usage-sources.py --offline
      - name: Prepare browser for learning and production verification
        timeout-minutes: 10
        run: |
          browser_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "CHROMIUM_PATH=$browser_path" >> "$GITHUB_ENV"
            "$browser_path" --version
          else
            npx playwright install --with-deps --only-shell chromium
          fi
      - name: Verify learning and data recovery in the browser
        run: npm run test:e2e
      - name: Verify built site before publishing
        run: npm run test:production
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
